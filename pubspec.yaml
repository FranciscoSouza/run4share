name: run4share
description: Turn workout stats into shareable images.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0

# Third-party packages are added by tool/setup.sh with `flutter pub add`,
# so the versions match the Flutter SDK installed on this machine.
dependencies:
  crop_your_image: ^2.0.1
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  freezed_annotation: ^3.1.0
  gal: ^3.0.1
  go_router: ^17.5.0
  health: ^13.3.2
  image_picker: ^1.2.4
  in_app_purchase: ^3.3.1
  in_app_review: ^2.0.12
  intl: any
  json_annotation: ^4.12.0
  lucide_icons_flutter: ^4.0.3
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  http_mock_adapter: ^0.6.1
  image: ^4.13.1
  json_serializable: ^6.15.2
  sqlite3: ^3.9.1
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Official Strava brand assets (developers.strava.com/guidelines),
    # used unmodified as their guidelines require.
    - assets/strava/
    # Onboarding photos (see the README there).
    - assets/onboarding/
    # Template photos (see the README there).
    - assets/templates/

  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

# App icon and launch screen, generated from assets/icon (see
# tool/icon/render_icons_test.dart):
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0D0C0A"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#FEFAF6"
  image: assets/icon/splash.png
  android_12:
    image: assets/icon/foreground.png
    icon_background_color: "#0D0C0A"
    color: "#FEFAF6"
