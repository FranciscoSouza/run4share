name: run4share
description: Turn workout stats into shareable images.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0

# Third-party packages are added by tool/setup.sh with `flutter pub add`,
# so the versions match the Flutter SDK installed on this machine.
dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: any
  json_annotation: ^4.12.0
  lucide_icons_flutter: ^4.0.3

dev_dependencies:
  build_runner: ^2.17.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  http_mock_adapter: ^0.6.1
  json_serializable: ^6.15.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
